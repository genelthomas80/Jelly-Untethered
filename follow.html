<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Follow Jelly Untethered</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;

      font-family: Arial, Helvetica, sans-serif;

      background: #f7f1e3;
      color: #17324d;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .logo {
      width: 210px;
      max-width: 70%;
      margin-bottom: 15px;
    }

    h1 {
      margin: 5px 0 10px;
      font-size: 30px;
      color: #17324d;
    }

    .tagline {
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      margin: 13px 0;

      background: #17324d;
      color: white;

      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 12px;

      transition: transform 0.15s ease,
                  background 0.15s ease;
    }

    .button:hover {
      background: #e87722;
      transform: translateY(-2px);
    }

    .amazon {
      background: #e87722;
    }

    .amazon:hover {
      background: #17324d;
    }

    .website {
      margin-top: 28px;
      font-size: 15px;
    }

    .website a {
      color: #17324d;
      font-weight: bold;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      opacity: 0.7;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- Replace logo.png with your actual logo filename -->
    <img src="logo.png"
         alt="Jelly Untethered"
         class="logo">

    <h1>Follow the Journey</h1>

    <div class="tagline">
      Solo travel • Cruises • Wildlife • Culture • Sarcasm • Humor
    </div>

    <a class="button"
       href="https://www.facebook.com/jellyuntethered"
       target="_blank">
       Facebook
    </a>

    <a class="button"
       href="https://www.instagram.com/jelly_untethered/"
       target="_blank">
       Instagram
    </a>

    <a class="button"
       href="https://www.tiktok.com/@jelly_untethered"
       target="_blank">
       TikTok
    </a>

    <a class="button"
       href="https://www.youtube.com/@jelly_untethered"
       target="_blank">
       YouTube
    </a>

    <a class="button amazon"
       href="https://a.co/d/0fnFenxN"
       target="_blank">
       Shop My Amazon Favorites
    </a>

    <div class="website">
      Or explore
      <a href="https://jellyuntethered.com">
        JellyUntethered.com
      </a>
    </div>

    <div class="footer">
      Traveling the world. Collecting stories along the way.
    </div>

  </div>

</body>
</html>
